name: BigFrame reCAPTCHA loader diagnostic

on:
  push:
    paths:
      - .github/workflows/bigframe-contact-form-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Inspect scripts and loaded resources
        run: |
          cat > inspect.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          try {
            await page.goto('https://bigframe.jp/inq/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(3000);
            const scripts = await page.locator('script').evaluateAll(nodes => nodes.map((s, index) => ({
              index,
              id: s.id || '',
              src: s.src || '',
              type: s.type || '',
              data: Object.fromEntries([...s.attributes].filter(a => a.name.startsWith('data-')).map(a => [a.name, a.value])),
              inlineExcerpt: s.src ? '' : (s.textContent || '').replace(/\s+/g, ' ').slice(0, 500)
            })).filter(x => /recaptcha|captcha|wpforms/i.test(`${x.id} ${x.src} ${x.inlineExcerpt}`))));
            const resources = await page.evaluate(() => performance.getEntriesByType('resource')
              .map(x => x.name)
              .filter(x => /recaptcha|captcha/i.test(x)));
            const pluginAssets = await page.evaluate(() => performance.getEntriesByType('resource')
              .map(x => x.name)
              .filter(x => /\/wp-content\/(plugins|themes)\//.test(x)));
            console.log('RELEVANT_SCRIPT_TAGS=' + JSON.stringify(scripts, null, 2));
            console.log('CAPTCHA_RESOURCES=' + JSON.stringify(resources, null, 2));
            console.log('PLUGIN_THEME_ASSETS=' + JSON.stringify([...new Set(pluginAssets)].sort(), null, 2));
          } finally {
            await browser.close();
          }
          JS
          node inspect.mjs
