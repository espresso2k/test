name: BigFrame form-plugin usage audit

on:
  push:
    paths:
      - .github/workflows/bigframe-contact-form-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Crawl public sitemaps and identify form plugin usage
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          cat > audit.py <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from collections import deque
          from urllib.parse import urlparse
          import requests

          BASE = 'https://bigframe.jp'
          session = requests.Session()
          session.headers['User-Agent'] = 'Mozilla/5.0 BigFrameFormAudit/1.0'

          sitemap_queue = deque([BASE + '/wp-sitemap.xml', BASE + '/sitemap_index.xml'])
          seen_sitemaps = set()
          urls = set([BASE + '/', BASE + '/inq/'])

          while sitemap_queue and len(seen_sitemaps) < 50:
              sm = sitemap_queue.popleft()
              if sm in seen_sitemaps:
                  continue
              seen_sitemaps.add(sm)
              try:
                  r = session.get(sm, timeout=25)
                  if r.status_code != 200 or '<loc>' not in r.text:
                      continue
                  root = ET.fromstring(r.content)
                  locs = [e.text.strip() for e in root.iter() if e.tag.endswith('loc') and e.text]
                  for loc in locs:
                      if urlparse(loc).netloc not in {'bigframe.jp', 'www.bigframe.jp'}:
                          continue
                      if loc.lower().endswith('.xml'):
                          sitemap_queue.append(loc)
                      else:
                          urls.add(loc)
              except Exception as exc:
                  print(f'SITEMAP_ERROR {sm} {type(exc).__name__}: {exc}')

          print(f'SITEMAPS_SCANNED={len(seen_sitemaps)} URLS_DISCOVERED={len(urls)}')
          wpforms_pages = []
          wpzoom_pages = []
          wpzoom_asset_only_pages = []
          failures = []

          wpforms_patterns = [r'id=["\']wpforms-form-', r'class=["\'][^"\']*wpforms-form', r'wpforms\[fields\]']
          wpzoom_markup_patterns = [
              r'id=["\'][^"\']*wpzoom[^"\']*form',
              r'class=["\'][^"\']*(?:wpzoom-form|wpz-form|wpzoom_forms)',
              r'name=["\']wpzoom',
              r'data-(?:wpzoom|wpz)[^=]*=',
          ]

          for i, url in enumerate(sorted(urls), 1):
              try:
                  r = session.get(url, timeout=25, allow_redirects=True)
                  ctype = r.headers.get('content-type', '')
                  if r.status_code != 200 or 'text/html' not in ctype:
                      continue
                  html = r.text
                  low = html.lower()
                  has_wpforms = any(re.search(p, html, re.I) for p in wpforms_patterns)
                  has_wpzoom_markup = any(re.search(p, html, re.I) for p in wpzoom_markup_patterns)
                  has_wpzoom_assets = '/wp-content/plugins/wpzoom-forms/' in low
                  if has_wpforms:
                      ids = sorted(set(re.findall(r'wpforms-form-(\d+)', html, re.I)))
                      wpforms_pages.append((url, ids))
                  if has_wpzoom_markup:
                      excerpts = []
                      for p in wpzoom_markup_patterns:
                          m = re.search(p, html, re.I)
                          if m:
                              excerpts.append(html[max(0,m.start()-100):m.end()+250].replace('\n',' ')[:400])
                      wpzoom_pages.append((url, excerpts[:3]))
                  elif has_wpzoom_assets:
                      wpzoom_asset_only_pages.append(url)
              except Exception as exc:
                  failures.append((url, f'{type(exc).__name__}: {exc}'))

          print('WPFORMS_PAGES_BEGIN')
          for url, ids in wpforms_pages:
              print(url, 'FORM_IDS=' + ','.join(ids))
          print('WPFORMS_PAGES_END')
          print('WPZOOM_MARKUP_PAGES_BEGIN')
          for url, excerpts in wpzoom_pages:
              print(url, 'EXCERPTS=' + repr(excerpts))
          print('WPZOOM_MARKUP_PAGES_END')
          print('WPZOOM_ASSET_ONLY_COUNT=' + str(len(wpzoom_asset_only_pages)))
          print('WPZOOM_ASSET_ONLY_SAMPLE=' + repr(wpzoom_asset_only_pages[:20]))
          print('FAILURES=' + repr(failures[:20]))
          print(f'SUMMARY wpforms_pages={len(wpforms_pages)} wpzoom_markup_pages={len(wpzoom_pages)} wpzoom_asset_only_pages={len(wpzoom_asset_only_pages)}')
          PY
          python audit.py
