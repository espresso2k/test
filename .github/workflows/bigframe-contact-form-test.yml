name: BigFrame contact form browser test

on:
  push:
    paths:
      - .github/workflows/bigframe-contact-form-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-contact-form:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Submit the public form in a real browser
        env:
          TEST_TOKEN: BF-FORM-20260904-BROWSER-${{ github.run_id }}
        run: |
          cat > /tmp/test_form.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const token = process.env.TEST_TOKEN;
          const pageUrl = 'https://bigframe.jp/inq/';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            locale: 'ja-JP',
            timezoneId: 'Asia/Tokyo',
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36 BigFrameFormHealthCheck/1.0',
          });
          const page = await context.newPage();

          const relevantResponses = [];
          page.on('console', msg => console.log(`BROWSER_CONSOLE ${msg.type()}: ${msg.text()}`));
          page.on('pageerror', err => console.log(`PAGE_ERROR: ${err.message}`));
          page.on('requestfailed', req => console.log(`REQUEST_FAILED ${req.method()} ${req.url()} :: ${req.failure()?.errorText}`));
          page.on('response', async response => {
            const url = response.url();
            if (/admin-ajax\.php|wpforms|recaptcha|turnstile|hcaptcha/i.test(url)) {
              let excerpt = '';
              try {
                const text = await response.text();
                excerpt = text.replace(/\s+/g, ' ').slice(0, 1500);
              } catch {}
              const item = `${response.status()} ${response.request().method()} ${url} :: ${excerpt}`;
              relevantResponses.push(item);
              console.log(`RELEVANT_RESPONSE ${item}`);
            }
          });

          try {
            const nav = await page.goto(pageUrl, { waitUntil: 'networkidle', timeout: 60000 });
            console.log(`NAVIGATION status=${nav?.status()} url=${page.url()}`);
            const form = page.locator('#wpforms-form-7052');
            await form.waitFor({ state: 'visible', timeout: 30000 });

            const formInfo = await form.evaluate(el => ({
              id: el.id,
              className: el.className,
              action: el.action,
              method: el.method,
              attributes: Object.fromEntries([...el.attributes].map(a => [a.name, a.value])),
            }));
            console.log(`FORM_INFO ${JSON.stringify(formInfo)}`);

            const controls = await form.locator('input, textarea, select, button').evaluateAll(nodes => nodes.map(node => {
              const id = node.id || '';
              const explicit = id ? document.querySelector(`label[for="${CSS.escape(id)}"]`) : null;
              const wrapping = node.closest('label');
              const container = node.closest('.wpforms-field');
              return {
                tag: node.tagName,
                type: node.getAttribute('type') || '',
                id,
                name: node.getAttribute('name') || '',
                value: node.getAttribute('value') || '',
                visible: !!(node.offsetWidth || node.offsetHeight || node.getClientRects().length),
                required: node.required || node.getAttribute('aria-required') === 'true',
                label: (explicit?.innerText || wrapping?.innerText || container?.querySelector('label')?.innerText || '').trim(),
                containerText: (container?.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 300),
              };
            }));
            console.log(`CONTROLS ${JSON.stringify(controls)}`);

            const fillIfVisible = async (selector, value) => {
              const locator = page.locator(selector);
              if (await locator.count() && await locator.first().isVisible()) {
                await locator.first().fill(value);
                console.log(`FILLED ${selector}`);
              }
            };

            await fillIfVisible('#wpforms-7052-field_1', 'BigFrameフォーム動作確認');
            await fillIfVisible('#wpforms-7052-field_6', '合同会社BigFrame');
            await fillIfVisible('#wpforms-7052-field_2', '07044958161');
            await fillIfVisible('#wpforms-7052-field_3', 'info@bigframe.jp');
            await fillIfVisible(
              '#wpforms-7052-field_5',
              `【自動動作確認・対応不要】公開お問い合わせフォームの機能確認です。識別子: ${token}。実際の問い合わせではありません。`
            );

            const radioSelector = 'input[name="wpforms[fields][4]"]';
            const radios = page.locator(radioSelector);
            const radioCount = await radios.count();
            let checked = false;
            for (let i = 0; i < radioCount; i++) {
              const radio = radios.nth(i);
              const id = await radio.getAttribute('id');
              const value = await radio.getAttribute('value') || '';
              const label = id ? page.locator(`label[for="${id}"]`) : null;
              const labelText = label && await label.count() ? await label.first().innerText() : '';
              if (/メール|mail/i.test(`${value} ${labelText}`)) {
                await radio.check();
                console.log(`CHECKED_RADIO value=${value} label=${labelText}`);
                checked = true;
                break;
              }
            }
            if (!checked && radioCount > 0) {
              await radios.first().check();
              console.log(`CHECKED_RADIO first value=${await radios.first().getAttribute('value')}`);
            }

            const visibleValues = await form.locator('input:not([type="hidden"]), textarea, select').evaluateAll(nodes => nodes.map(node => ({
              id: node.id,
              name: node.getAttribute('name'),
              type: node.getAttribute('type'),
              value: node.type === 'password' ? '[redacted]' : node.value,
              checked: node.checked,
            })));
            console.log(`VISIBLE_VALUES ${JSON.stringify(visibleValues)}`);

            await page.screenshot({ path: '/tmp/before-submit.png', fullPage: true });

            const submit = page.locator('#wpforms-submit-7052');
            await submit.scrollIntoViewIfNeeded();
            console.log(`SUBMIT enabled=${await submit.isEnabled()} visible=${await submit.isVisible()}`);

            await submit.click({ timeout: 30000 });
            await page.waitForTimeout(12000);

            const confirmationSelectors = [
              '#wpforms-confirmation-7052',
              '.wpforms-confirmation-container-full',
              '.wpforms-confirmation-container',
            ];
            const confirmations = [];
            for (const selector of confirmationSelectors) {
              const locator = page.locator(selector);
              const count = await locator.count();
              for (let i = 0; i < count; i++) {
                if (await locator.nth(i).isVisible()) {
                  confirmations.push({ selector, text: (await locator.nth(i).innerText()).trim() });
                }
              }
            }

            const errorSelectors = [
              '#wpforms-form-7052 .wpforms-error',
              '#wpforms-form-7052 [role="alert"]',
              '#wpforms-form-7052 .wpforms-field-limit-text',
              '#wpforms-form-7052 .wpforms-process-error',
            ];
            const errors = [];
            for (const selector of errorSelectors) {
              const locator = page.locator(selector);
              const count = await locator.count();
              for (let i = 0; i < count; i++) {
                if (await locator.nth(i).isVisible()) {
                  errors.push({ selector, text: (await locator.nth(i).innerText()).trim() });
                }
              }
            }

            let formText = '';
            if (await form.count()) {
              formText = (await form.innerText()).replace(/\s+/g, ' ').trim().slice(0, 4000);
            }
            console.log(`CONFIRMATIONS ${JSON.stringify(confirmations)}`);
            console.log(`ERRORS ${JSON.stringify(errors)}`);
            console.log(`FORM_TEXT_AFTER ${formText}`);
            console.log(`RELEVANT_RESPONSES ${JSON.stringify(relevantResponses)}`);
            console.log(`TEST_TOKEN=${token}`);

            await page.screenshot({ path: '/tmp/after-submit.png', fullPage: true });
            fs.writeFileSync('/tmp/result.json', JSON.stringify({ token, confirmations, errors, formText, relevantResponses }, null, 2));

            if (!confirmations.length) {
              process.exitCode = 1;
            }
          } finally {
            await browser.close();
          }
          JS
          node /tmp/test_form.mjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigframe-form-browser-test-${{ github.run_id }}
          path: |
            /tmp/before-submit.png
            /tmp/after-submit.png
            /tmp/result.json
          if-no-files-found: warn
          retention-days: 7
